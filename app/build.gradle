اپنی app/build.gradle فائل کا پرانا کوڈ ختم کرکے یہ Paste کریں:

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xarena.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xarena.remote'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}
